/* Layout: floating editor — library | stage | inspector over a timeline, CapCut-style; collapses to stage + tool dock on phones */
:root{
  color-scheme:dark;
  --bg:#05060a; --panel:#0c0e14; --panel2:#11141c; --panel3:#171b25;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#eef1f7; --muted:#8b93a7; --dim:#596074;
  --accent:#3d7bff; --accent2:#7a5cff; --hot:#ff8a1f;
  --c-multi:#3d7bff; --c-single:#b44dff; --c-misc:#2ee6c8; --c-3d:#ff4d7d; --c-shine:#ff8a1f; --c-look:#f2b33d; --c-mat:#57e36b;
  --f-ui:"Geist",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,monospace;
  --f-display:"Inter",ui-sans-serif,system-ui,sans-serif;
  --f-num:"Instrument Serif",Georgia,serif;
  --r:16px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;box-sizing:border-box;display:grid;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  grid-template-columns:340px minmax(0,1fr) 330px;grid-template-rows:52px minmax(0,1fr) 214px;
  grid-template-areas:"top top top" "lib stage insp" "tl tl tl";
  background:radial-gradient(1200px 600px at 50% -10%,rgba(61,123,255,.10),transparent 60%),var(--bg)}
@media (max-width:1240px){#app{grid-template-columns:300px minmax(0,1fr) 300px}}

.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);min-width:0;min-height:0}

/* ---------- top bar ---------- */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{height:30px;width:auto;display:block;overflow:visible}
.brand small{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line2);padding-left:10px}
.proj{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.proj input{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:600;font-size:13px;width:min(260px,100%);min-width:0}
.proj input:hover{border-color:var(--line)}
.proj input:focus{border-color:var(--accent);outline:0;background:var(--panel)}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:.15s}
.iconbtn:hover{color:var(--text);background:var(--panel3);border-color:var(--line)}
.iconbtn svg{width:17px;height:17px}
.iconbtn[disabled]{opacity:.35;pointer-events:none}

.aspects{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.aspects button{padding:6px 10px;border-radius:9px;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.aspects button i{display:inline-block;border:1.5px solid currentColor;border-radius:2px}
.aspects button[aria-pressed="true"]{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}

/* signature export button: conic edge light + sweep */
.btn-export{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px 0 14px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.01em;color:#fff;background:#0b1430;overflow:hidden}
.btn-export::before{content:"";position:absolute;inset:-60%;z-index:-2;background:conic-gradient(from var(--spin,0deg),#3d7bff,#7a5cff,#ff4d7d,#ff8a1f,#2ee6c8,#3d7bff);animation:spin 4s linear infinite}
.btn-export::after{content:"";position:absolute;inset:1.5px;z-index:-1;border-radius:999px;background:linear-gradient(180deg,#1a2a5e,#0b1430 60%)}
.btn-export span.sw{position:absolute;inset:0;z-index:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s ease}
.btn-export:hover span.sw{transform:translateX(120%)}
.btn-export svg{width:16px;height:16px;position:relative}
.btn-export b{position:relative;font-weight:700}
@property --spin{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--spin:360deg}}

/* ---------- side columns ---------- */
.lib{grid-area:lib;display:flex;flex-direction:column;overflow:hidden}
.insp{grid-area:insp;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:10px;color:var(--muted);font-weight:600;font-size:12px;position:relative;transition:.15s}
.tabs button svg{width:15px;height:15px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);background:var(--panel3)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:2px;height:2px;border-radius:2px;background:var(--tc,var(--accent));box-shadow:0 0 10px var(--tc,var(--accent))}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;scrollbar-width:thin;scrollbar-color:#2a3040 transparent}
.panel{display:flex;flex-direction:column;gap:16px}

/* category block like the reference cards */
.cat{position:relative;border-radius:20px;padding:14px 12px 12px;border:1px solid rgba(255,255,255,.14);background:
  radial-gradient(120% 70% at 85% 10%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),
  radial-gradient(90% 60% at 0% 100%,color-mix(in srgb,var(--c) 12%,transparent),transparent 60%),#07080c;overflow:hidden}
.cat-h{display:flex;align-items:flex-end;gap:0;margin:0 0 12px 4px;line-height:.8}
.cat-n{font-family:var(--f-num);font-style:italic;font-size:58px;line-height:.7;background:linear-gradient(170deg,#fff 0%,var(--c) 45%,color-mix(in srgb,var(--c) 50%,#000) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 color-mix(in srgb,var(--c) 45%,#000)) drop-shadow(0 0 14px color-mix(in srgb,var(--c) 60%,transparent));margin-right:-4px;position:relative;z-index:0}
.cat-t{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:-.045em;color:#fff;position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.tile{position:relative;aspect-ratio:1.5;border-radius:14px;background:radial-gradient(100% 90% at 50% 0%,#141823,#040506 70%);border:1px solid rgba(255,255,255,.38);overflow:hidden;display:grid;place-items:center;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s;--c:var(--accent)}
.tile::before{content:"";position:absolute;left:12%;right:12%;bottom:12%;height:22%;background:radial-gradient(50% 50% at 50% 50%,color-mix(in srgb,var(--lc,var(--c)) 75%,transparent),transparent 72%);filter:blur(5px);opacity:.75;transition:opacity .2s}
.tile::after{content:"";position:absolute;left:24%;right:24%;bottom:calc(12% + 9%);height:2px;border-radius:2px;background:radial-gradient(50% 50% at 50% 50%,var(--lcore,#fff) 0,color-mix(in srgb,var(--lc,var(--c)) 80%,#fff) 35%,transparent 100%);opacity:.9}
.tile:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.7)}
.nostreak .tile::before,.nostreak .tile::after{display:none!important;content:none!important}
.tilebar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 16px;margin:-4px 0 -6px}
.lt{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0;-webkit-user-select:none;user-select:none}
.lt i{width:36px;height:21px;border-radius:99px;background:#252b38;position:relative;flex:none;transition:background .2s,box-shadow .2s}
.lt i::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#8b93a7;transition:left .22s cubic-bezier(.2,.8,.2,1),background .2s}
.lt[aria-pressed="true"]{color:#fff}
.lt[aria-pressed="true"] i{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px -2px var(--accent)}
.lt[aria-pressed="true"] i::after{left:18px;background:#fff}
.ltc{font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:8px;border:1px solid var(--line2)}.ltc:hover{color:#fff;border-color:var(--accent)}
.tilebar{align-items:center}

.tile:hover::before{opacity:1}
.tile[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px -4px var(--c),inset 0 0 22px -10px var(--c)}
.tile[aria-pressed="true"] .dot{opacity:1;transform:scale(1)}
.tile .lbl{position:relative;z-index:1;font-family:var(--f-display);font-weight:900;font-size:clamp(17px,1.55vw,23px);letter-spacing:-.05em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.8);padding:0 6px;text-align:center;line-height:1;white-space:nowrap}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.tile canvas.hov{opacity:0;transition:opacity .12s}
.tile.playing canvas.hov{opacity:1}
.tile.playing .lbl{opacity:0}
.tile .dot{position:absolute;top:7px;right:7px;width:16px;height:16px;border-radius:50%;background:var(--c);display:grid;place-items:center;z-index:3;opacity:0;transform:scale(.4);transition:.2s;box-shadow:0 0 10px var(--c)}
.tile .dot svg{width:10px;height:10px;color:#000}
.tile.look{aspect-ratio:.9}
.newtag{position:absolute;top:8px;left:8px;z-index:3;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;padding:3px 6px;border-radius:6px;background:#ffcf3a;color:#000;font-weight:600}
.tile.look .name{position:absolute;left:10px;bottom:8px;z-index:3;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.7);text-transform:uppercase}
.tile.mat{aspect-ratio:1.25}
.tile.mat .name{position:absolute;left:0;right:0;bottom:7px;z-index:3;text-align:center;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:rgba(255,255,255,.65);text-transform:uppercase}

/* ---------- controls ---------- */
.sec{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{margin:0;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl-h label{color:#c9cfdc;font-size:12.5px}
.ctl-h output{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer;--v:50%}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2)) 0/var(--v) 100% no-repeat,#252b38}
.rng::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2)) 0/var(--v) 100% no-repeat,#252b38}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 0 4px rgba(61,123,255,.25),0 2px 6px rgba(0,0,0,.5);transition:box-shadow .15s}
.rng::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(61,123,255,.25)}
.rng:active::-webkit-slider-thumb{box-shadow:0 0 0 7px rgba(61,123,255,.3),0 0 18px rgba(61,123,255,.8)}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.seg{position:relative;display:flex;flex-wrap:wrap;background:#080a0f;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1 0 auto;position:relative;z-index:1;padding:7px 6px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);transition:color .15s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:#fff}
.seg .thumb{position:absolute;top:3px;height:calc(100% - 6px);border-radius:8px;transition:left .22s cubic-bezier(.2,.8,.2,1),width .22s cubic-bezier(.2,.8,.2,1),top .22s;background:linear-gradient(180deg,#26304a,#1a2033);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 14px -4px var(--accent)}

.sw-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.sw-toggle span{color:#c9cfdc;font-size:12.5px}
.sw-toggle input{position:absolute;opacity:0;pointer-events:none}
.sw-toggle i{width:38px;height:22px;border-radius:99px;background:#252b38;position:relative;transition:.2s;flex:none}
.sw-toggle i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8b93a7;transition:.22s cubic-bezier(.2,.8,.2,1)}
.sw-toggle input:checked+i{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px -2px var(--accent)}
.sw-toggle input:checked+i::after{left:19px;background:#fff}
.sw-toggle input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

.colorctl{display:flex;align-items:center;gap:8px}
.colorctl .swatch{position:relative;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);overflow:hidden;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.colorctl .swatch input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:0;padding:0;cursor:pointer;opacity:0}
.colorctl .hex{flex:1;min-width:0;background:#080a0f;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{width:22px;height:22px;border-radius:7px;border:1px solid rgba(255,255,255,.18)}
.chips button:hover{transform:scale(1.1)}

.txtin{width:100%;box-sizing:border-box;background:#080a0f;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
.txtin:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,123,255,.18)}
.linechips{display:flex;gap:6px;flex-wrap:wrap}
.linechips button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linechips button[aria-pressed="true"]{color:#fff;border-color:var(--accent);background:rgba(61,123,255,.12);box-shadow:0 0 14px -6px var(--accent)}
.linechips .add{color:var(--text);border-style:dashed}
.fontgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fontgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:#080a0f;text-align:left;overflow:hidden;transition:.15s}
.fontgrid button:hover{border-color:var(--line2)}
.fontgrid button b{font-size:22px;line-height:1.15;font-weight:inherit;white-space:nowrap;color:#fff}
.fontgrid button small{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.fontgrid button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px -6px var(--accent)}
.pillbtn{padding:8px 12px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:12px;color:#dfe4ee;background:linear-gradient(180deg,#1a1f2c,#121621);transition:.15s}
.pillbtn:hover{border-color:var(--accent);box-shadow:0 0 14px -6px var(--accent)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.hint{color:var(--dim);font-size:11.5px;line-height:1.45;margin:0}

/* ---------- stage ---------- */
.stage-col{grid-area:stage;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;border-radius:var(--r) var(--r) 0 0;
  background:radial-gradient(70% 60% at 50% 45%,#0f1320,#05060a 75%)}
.cwrap{position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 80px -20px rgba(0,0,0,.9),0 0 80px -30px rgba(61,123,255,.5);border-radius:6px;overflow:hidden}
.cwrap.checker{background:repeating-conic-gradient(#2a2e38 0 25%,#1d2028 0 50%) 0 0/18px 18px}
#view{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
.selbox{position:absolute;pointer-events:none;border:1px dashed rgba(255,255,255,.55);border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.selbox::before,.selbox::after{content:"";position:absolute;width:7px;height:7px;background:#fff;border-radius:2px}
.selbox::before{left:-4px;top:-4px}.selbox::after{right:-4px;bottom:-4px}
.res-tag{position:absolute;top:12px;left:12px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:rgba(5,6,10,.7);border:1px solid var(--line);padding:4px 8px;border-radius:8px;backdrop-filter:blur(8px);letter-spacing:.04em}
.stagebar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.bgchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bgchips button,.bgchips label{width:24px;height:24px;border-radius:8px;border:1px solid rgba(255,255,255,.2);position:relative;cursor:pointer;flex:none}
.bgchips [aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #fff}
.bgchips .chk{background:repeating-conic-gradient(#555 0 25%,#ccc 0 50%) 0 0/10px 10px}
.bgchips label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.bgchips label{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.transport{display:flex;align-items:center;gap:10px}
.playbtn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff;
  background:conic-gradient(var(--accent) calc(var(--prog,0)*1turn),rgba(255,255,255,.1) 0)}
.playbtn::before{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2a3554,#0b0f1c)}
.playbtn svg{position:relative;width:20px;height:20px}
.playbtn:hover::before{background:radial-gradient(circle at 50% 30%,#34436c,#0e1322)}
.tc{justify-self:end;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tc b{color:var(--text);font-weight:500}
.iconbtn.on{color:var(--accent);background:rgba(61,123,255,.1)}

/* ---------- timeline ---------- */
.tl{grid-area:tl;display:flex;flex-direction:column;overflow:hidden}
.tl-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tl-head .sp{flex:1}
.tl-body{flex:1;display:grid;grid-template-columns:96px minmax(0,1fr);min-height:0}
.tl-labels{display:flex;flex-direction:column;border-right:1px solid var(--line)}
.tl-labels .rs{height:24px;flex:none}
.tl-labels div.tk{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;font-size:12px;color:#c9cfdc}
.tl-labels div.tk i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-weight:900;font-size:11px;color:#000}
.tl-area{position:relative;display:flex;flex-direction:column;padding:0 14px;touch-action:none;cursor:pointer;min-width:0}
.ruler{height:24px;flex:none;position:relative;border-bottom:1px solid var(--line)}
.ruler span{position:absolute;bottom:0;width:1px;background:#2a3040;height:6px}
.ruler span.maj{height:11px;background:#3a4256}
.ruler span em{position:absolute;bottom:12px;left:3px;font-style:normal;font-family:var(--f-mono);font-size:9.5px;color:var(--dim)}
.trk{flex:1;position:relative;display:flex;align-items:center}
.clip{position:absolute;top:18%;bottom:18%;border-radius:9px;overflow:hidden;display:flex;align-items:center;cursor:default;
  background:linear-gradient(180deg,#2350c8,#1a3b96);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 18px -8px rgba(61,123,255,.8)}
.clip .zin,.clip .zout{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px)}
.clip .zin{left:0;border-right:1px solid rgba(255,255,255,.4)}
.clip .zout{right:0;border-left:1px solid rgba(255,255,255,.4)}
.clip .cl-l{position:relative;z-index:1;padding:0 10px;font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
.clip .hd{position:absolute;top:0;bottom:0;width:12px;z-index:2;cursor:ew-resize;display:grid;place-items:center}
.clip .hd::after{content:"";width:3px;height:42%;border-radius:2px;background:rgba(255,255,255,.85)}
.clip.shine{background:linear-gradient(180deg,#ff9a3c,#d9620f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 6px 18px -8px rgba(255,138,31,.9);cursor:grab}
.ghost{position:absolute;top:18%;bottom:18%;border-radius:9px;border:1px dashed rgba(255,154,60,.55);background:rgba(255,138,31,.08);pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7);pointer-events:none;z-index:5}
.playhead::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:14px;background:#fff;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);border-radius:2px}
.tl-off .clip.shine{opacity:.35;filter:grayscale(1)}

/* ---------- mobile dock ---------- */
.mobtabs,.mobpanel{display:none}
@media (max-width:979px){
  #app{grid-template-columns:minmax(0,1fr);gap:8px;padding-block:6px;
    grid-template-rows:auto minmax(180px,1fr) auto 50px minmax(0,.95fr);
    grid-template-areas:"top" "stage" "tl" "tabs" "mp"}
  .lib,.insp{display:none}
  .top{padding:0 2px;gap:8px;flex-wrap:wrap}
  .brand small,.proj{display:none}
  .top .sp{flex:1}
  .aspects button{padding:5px 7px}
  .aspects button span{display:none}
  .btn-export{height:34px;padding:0 14px 0 11px}
  .stagebar{grid-template-columns:1fr auto;padding:8px}
  .stagebar .tc{display:none}
  .playbtn{width:44px;height:44px}
  .tl{height:auto}
  .tl-head{padding:6px 8px;gap:6px}.tl-head #tlInfo,.tl-head .zr{display:none}
  .tl-body{grid-template-columns:40px minmax(0,1fr);height:128px}
  .tl-labels div.tk{padding:0 8px}
  .tl-labels div.tk span{display:none}
  .mobtabs{grid-area:tabs;display:flex;gap:4px;padding:4px;overflow-x:auto;scrollbar-width:none}
  .mobtabs button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 10px;border-radius:12px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
  .mobtabs button svg{width:17px;height:17px}
  .mobtabs button[aria-selected="true"]{color:#fff;background:var(--panel3)}
  .mobtabs button[aria-selected="true"]::after{content:"";position:absolute;bottom:2px;left:35%;right:35%;height:2px;border-radius:2px;background:var(--tc);box-shadow:0 0 8px var(--tc)}
  .mobpanel{grid-area:mp;display:block;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  .tile .lbl{font-size:20px}
  .colorctl .hex,.proj input,.txtin{font-size:16px}
  .mobtabs button{min-width:54px;padding:0 6px}
  .keytip span{display:none}
}
@media (max-width:979px) and (min-width:600px){.mobpanel .grid2{grid-template-columns:repeat(3,1fr)}}

/* ---------- export modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,4,8,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(600px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:22px;background:linear-gradient(180deg,#141927,#0b0d14);border:1px solid var(--line2);box-shadow:0 40px 120px -20px #000,0 0 90px -40px var(--accent);padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:-.04em}
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt{position:relative;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line2);background:radial-gradient(120% 100% at 100% 0%,color-mix(in srgb,var(--c) 18%,transparent),transparent 60%),#090b11;display:flex;flex-direction:column;gap:4px;transition:.15s}
.fmt b{font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:-.03em}
.fmt small{color:var(--muted);font-size:11.5px}
.fmt[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px -8px var(--c)}
.fmt .badge{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 25%,transparent);color:#fff}
.exrow{display:flex;flex-direction:column;gap:8px}
.exrow>label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ex-note{font-size:12px;color:#ffcf8a;background:rgba(255,138,31,.08);border:1px solid rgba(255,138,31,.25);border-radius:12px;padding:10px 12px;line-height:1.45}
.ex-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ex-meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1.5}
.ex-meta b{color:var(--text);font-weight:500}
.prog{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),#1d2333 0);position:relative;box-shadow:0 0 60px -20px var(--accent)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#0b0d14}
.ring b{position:relative;font-family:var(--f-display);font-weight:900;font-size:34px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.prog p{margin:0;color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:center}
.done-prev{border-radius:14px;overflow:hidden;background:repeating-conic-gradient(#2a2e38 0 25%,#1d2028 0 50%) 0 0/18px 18px;display:grid;place-items:center;max-height:46vh}
.done-prev video,.done-prev img{max-width:100%;max-height:46vh;display:block}
.btnrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ghostbtn{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);font-weight:600}
.ghostbtn:hover{border-color:#fff}
.col{display:flex;flex-direction:column;gap:16px}
@media (max-width:600px){.modal{place-items:end center;padding-bottom:10px}.sheet{border-radius:22px 22px 18px 18px}.fmt-grid{grid-template-columns:1fr 1fr}.fmt{padding:12px}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:#151a27;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 20px 50px -10px #000;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.keytip{position:absolute;top:12px;right:12px;z-index:4;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border-radius:10px;background:rgba(5,6,10,.78);border:1px solid var(--line2);font-size:11.5px;color:var(--muted);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.keytip b{color:#fff;font-weight:700}
.keytip i,.kp-h i,.keycard i{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 12px -2px currentColor}
.keytip:hover{border-color:#fff}
.keypop{position:absolute;top:50px;right:12px;z-index:6;width:min(330px,calc(100% - 24px));box-sizing:border-box;max-height:calc(100% - 64px);overflow:auto;background:linear-gradient(180deg,#151a28,#0c0f17);border:1px solid var(--line2);border-radius:16px;padding:14px;box-shadow:0 30px 70px -20px #000;display:flex;flex-direction:column;gap:10px}
.kp-h{display:flex;align-items:center;gap:8px}.kp-h b{flex:1;font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:-.03em}
.keypop p{margin:0;font-size:12.5px;line-height:1.5;color:#c9cfdc}
.keypop p.kp-tip{color:var(--muted);font-size:12px;padding-left:10px;border-left:2px solid var(--line2)}
.keycard{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:#090b11;font-size:12px;color:#c9cfdc;line-height:1.4}
.keycard span{flex:1;min-width:0}.keycard b{color:#fff}
.drop{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.22);background:#080a0f;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(61,123,255,.07)}
.drop div{display:flex;flex-direction:column;gap:3px;min-width:0}.drop b{font-size:13px}.drop small{color:var(--muted);font-size:11.5px}
.drop-thumb{width:64px;height:64px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:repeating-conic-gradient(#20242e 0 25%,#181b23 0 50%) 0 0/12px 12px;overflow:hidden}
.drop-thumb canvas{width:100%;height:100%}.drop-thumb svg{width:26px;height:26px}
.tl-head .tlbtn{height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:#dfe4ee;background:#121621}
.tl-head .tlbtn:hover{border-color:var(--accent)}.tl-head .tlbtn[disabled]{opacity:.35;pointer-events:none}
.tl-head .iconbtn.sm{width:24px;height:24px;font-size:16px;font-family:var(--f-ui);text-transform:none}
.tl-head .zr{width:110px;height:16px}
.tl-scroll{position:relative;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:thin;scrollbar-color:#2a3040 transparent;-webkit-overflow-scrolling:touch}
.tl-content{position:relative;height:100%;display:flex;flex-direction:column;min-width:100%;touch-action:pan-x;cursor:pointer}
.trk .clip{cursor:grab}.trk .clip:active{cursor:grabbing}
.clip.cap{background:linear-gradient(180deg,#8a4dff,#5a23d6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.clip.cap .cl-l{padding:0 6px;font-size:10.5px;font-weight:600}
.clip.sel{box-shadow:0 0 0 2px #fff,0 6px 18px -6px rgba(61,123,255,.9);z-index:3}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2}
.clip .hl{left:0}.clip .hr{right:0}
.clip.sel .hl::after,.clip.sel .hr::after,.clip.shine .hr::after{content:"";position:absolute;top:25%;bottom:25%;left:4px;width:2px;border-radius:2px;background:#fff}
.clip.ghost{opacity:.4;pointer-events:none}
#trkV{background:linear-gradient(90deg,rgba(255,61,127,.06),transparent)}
#wave{position:absolute;top:14%;height:72%;pointer-events:none;opacity:.9}
.vname{position:absolute;left:18px;font-size:11px;color:var(--muted);pointer-events:none;white-space:nowrap;text-shadow:0 1px 4px #000}
#bgVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#view{position:relative;z-index:1}
.bigbtn{width:100%;height:44px;border-radius:12px;font-weight:700;font-size:13.5px;color:#fff;background:linear-gradient(180deg,#2f5ae8,#1b3596);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px -14px #3d7bff}
.bigbtn.alt{background:linear-gradient(180deg,#d6336f,#8f1d48);box-shadow:0 10px 30px -14px #ff3d7f}
.bigbtn:hover{filter:brightness(1.12)}.bigbtn[disabled]{opacity:.45;pointer-events:none}
.asr{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#c9cfdc}
.pbar{height:6px;border-radius:6px;background:#1d2333;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.asr.busy .pbar i{width:40%!important;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.vcard{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;border:1px solid var(--line2);background:#080a0f}.vcard b{font-size:13px;word-break:break-all}.vcard small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:#080a0f;border:1px solid var(--line);border-radius:10px;padding:9px 10px}.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:-.02em}.stat small{color:var(--muted);font-size:11px}
.rec{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:#090b11}.rec div{flex:1;min-width:0}.rec b{display:block;font-size:13px}.rec small{color:var(--muted);font-size:11.5px}
.caplist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding-right:2px}
.caprow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:center}
.caprow .tm{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:left;padding:6px 0}
.caprow .tm:hover{color:#fff}
.caprow input{width:100%;box-sizing:border-box;background:#080a0f;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.caprow input:focus{outline:0;border-color:var(--accent)}.caprow.on input{border-color:#8a4dff}
label.pillbtn{cursor:pointer;display:inline-flex;align-items:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em;pointer-events:none}
@media (prefers-reduced-motion:reduce){.btn-export::before{animation:none}.logo .lshine{display:none}}

<script>
"use strict";
/* =====================================================================
   WRD — motion type engine
   ===================================================================== */
const DEG=Math.PI/180;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const bump=p=>p<0||p>1?0:Math.sin(p*Math.PI);
function hex2rgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
const rgba=(h,a)=>{const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${clamp(a)})`};
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')}
const E={
  outCubic:t=>1-Math.pow(1-t,3),outQuart:t=>1-Math.pow(1-t,4),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),inCubic:t=>t*t*t,
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  inOutSine:t=>-(Math.cos(Math.PI*t)-1)/2,
  outBack:(t,s=1.70158)=>{const c=s+1;return 1+c*Math.pow(t-1,3)+s*Math.pow(t-1,2)},
  outElastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1,
  outBounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}
};

const FONTS=[
 {id:'inter',name:'Inter',fam:'Inter',w:900,weights:[400,600,800,900],fb:'sans-serif'},
 {id:'akira',name:'Akira Expanded',fam:'Akira Expanded',w:800,fb:'sans-serif',tag:'NEW'},
 {id:'montserrat',name:'Montserrat',fam:'Montserrat',w:800,weights:[700,800,900],fb:'sans-serif',tag:'NEW'},
 {id:'poppins',name:'Poppins',fam:'Poppins',w:800,weights:[600,700,800],fb:'sans-serif',tag:'NEW'},
 {id:'anton',name:'Anton',fam:'Anton',w:400,fb:'sans-serif',tag:'NEW'},
 {id:'archivo',name:'Archivo Black',fam:'Archivo Black',w:400,fb:'sans-serif',tag:'NEW'},
 {id:'bebas',name:'Bebas Neue',fam:'Bebas Neue',w:400,fb:'sans-serif'},
 {id:'teko',name:'Teko',fam:'Teko',w:600,weights:[500,600,700],fb:'sans-serif',tag:'NEW'},
 {id:'saira',name:'Saira Condensed',fam:'Saira Condensed',w:800,weights:[700,800,900],fb:'sans-serif',tag:'NEW'},
 {id:'cairo',name:'Cairo',fam:'Cairo',w:900,weights:[400,700,900],fb:'sans-serif'},
 {id:'greatvibes',name:'Great Vibes',fam:'Great Vibes',w:400,fb:'cursive',tag:'NEW'},
 {id:'sacramento',name:'Sacramento',fam:'Sacramento',w:400,fb:'cursive',tag:'NEW'},
 {id:'meaculpa',name:'Mea Culpa',fam:'Mea Culpa',w:400,fb:'cursive'},
 {id:'lobster',name:'Lobster',fam:'Lobster',w:400,fb:'cursive'},
 {id:'gochi',name:'Gochi Hand',fam:'Gochi Hand',w:400,fb:'cursive',tag:'NEW'},
 {id:'marker',name:'Permanent Marker',fam:'Permanent Marker',w:400,fb:'cursive',tag:'NEW'},
 {id:'gloria',name:'Gloria Hallelujah',fam:'Gloria Hallelujah',w:400,fb:'cursive'},
 {id:'garamond',name:'EB Garamond',fam:'EB Garamond',w:800,weights:[400,600,800],italic:true,fb:'serif'},
 {id:'instrument',name:'Instrument Serif',fam:'Instrument Serif',w:400,italic:true,fb:'serif'},
 {id:'consent',name:'Manufacturing Consent',fam:'Manufacturing Consent',w:400,fb:'serif'},
 {id:'swanky',name:'Fontdiner Swanky',fam:'Fontdiner Swanky',w:400,fb:'cursive'},
 {id:'majormono',name:'Major Mono Display',fam:'Major Mono Display',w:400,fb:'monospace'},
];
const FONT_BY=Object.fromEntries(FONTS.map(f=>[f.id,f]));
function fontStr(L,px){const f=FONT_BY[L.font]||FONTS[0];const it=L.italic&&f.italic?'italic ':'';const w=f.weights?(f.weights.includes(L.weight)?L.weight:f.w):f.w;return`${it}${w} ${Math.max(1,px).toFixed(2)}px "${f.fam}", ${f.fb}`}
const applyCase=(t,c)=>c==='upper'?t.toUpperCase():c==='lower'?t.toLowerCase():t;

/* ---------- custom image layer ---------- */
const IMG={el:null};let imgVer=0,SAMPLE=null;
function sampleIcon(){if(SAMPLE)return SAMPLE;const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  const g=x.createLinearGradient(40,40,472,472);g.addColorStop(0,'#ff3d7f');g.addColorStop(.5,'#7a5cff');g.addColorStop(1,'#2ee6c8');x.fillStyle=g;x.beginPath();if(x.roundRect)x.roundRect(40,40,432,432,110);else x.rect(40,40,432,432);x.fill();
  const gl=x.createLinearGradient(0,40,0,260);gl.addColorStop(0,'rgba(255,255,255,.45)');gl.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gl;x.fill();
  x.lineWidth=10;x.strokeStyle='rgba(255,255,255,.4)';x.stroke();
  x.fillStyle='#fff';x.beginPath();[[256,112],[286,226],[400,256],[286,286],[256,400],[226,286],[112,256],[226,226]].forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill();SAMPLE=c;return c}
function imgSrc(S){if(!S.img||!S.img.on)return null;return IMG.el||(S.img.sample?sampleIcon():null)}
try{const d=localStorage.getItem('wrd.img');if(d){const im=new Image();im.onload=()=>{IMG.el=im;imgVer++;try{dirty=true}catch(e){}};im.src=d}}catch(e){}
function countText(txt,e){let has=false;const out=txt.replace(/\d[\d,]*(?:\.\d+)?/g,tok=>{has=true;const dec=(tok.split('.')[1]||'').length;const num=parseFloat(tok.replace(/,/g,''))||0;let v=(num*e).toFixed(dec);if(tok.includes(',')){const [i,d]=v.split('.');v=i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(d?'.'+d:'')}return v});return has?out:null}

/* ---------- materials ---------- */
const MATS={
 flat:{name:'Flat',user:1,stops:L=>[[0,L.c1]],bevel:0},
 gradient:{name:'Gradient',user:2,angled:1,stops:L=>[[0,L.c1],[1,L.c2]],bevel:0},
 glossy:{name:'Glossy',user:1,stops:L=>[[0,mix(L.c1,'#ffffff',.7)],[.46,mix(L.c1,'#ffffff',.22)],[.54,L.c1],[1,mix(L.c1,'#000000',.4)]],bevel:.6,gloss:.3},
 emboss:{name:'Emboss',user:1,stops:L=>[[0,mix(L.c1,'#ffffff',.45)],[.55,L.c1],[1,mix(L.c1,'#000000',.45)]],bevel:1.1},
 neon:{name:'Neon',user:1,neon:1,stops:L=>[[0,mix(L.c1,'#ffffff',.82)]],bevel:0},
 gold1:{name:'Gold 1',stops:()=>[[0,'#fff6c8'],[.28,'#f7c64c'],[.52,'#a8650f'],[.68,'#f5c04a'],[1,'#7a4108']],bevel:.9},
 gold2:{name:'Gold 2',stops:()=>[[0,'#ffe58a'],[.42,'#e8a92a'],[.56,'#b0700e'],[1,'#ffd25e']],bevel:.7,stripes:1},
 chrome:{name:'Chrome',stops:()=>[[0,'#ffffff'],[.42,'#aeb8c8'],[.5,'#1f2633'],[.57,'#5b6a82'],[.82,'#e3ebf7'],[1,'#ffffff']],bevel:.8},
 silver:{name:'Bevel',stops:()=>[[0,'#ffffff'],[.5,'#f0f0f0'],[.78,'#bdbdbd'],[1,'#8a8a8a']],bevel:1.25},
 ice:{name:'Ice',stops:()=>[[0,'#dff3ff'],[.44,'#77bbff'],[.56,'#2f7bff'],[1,'#1946c8']],bevel:.7,gloss:.28},
 fire:{name:'Fire',stops:()=>[[0,'#ffe08a'],[.42,'#ff9a2e'],[1,'#ff4a12']],bevel:.5,gloss:.15},
};

/* ---------- animations (25) ---------- */
const SCR='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&@';
function selRect(p,G){const b=G.block,pad=G.em*.16,mq=E.inOutCubic(clamp((p-.14)/.66));return{x:b.x0-pad,y:b.top-pad,w:(b.x1-b.x0+2*pad)*mq,h:(b.bottom-b.top+2*pad)*mq,mq,pad}}
function hlEdge(p,ln,G){const n=G.nL,sp=n>1?Math.min(.18,.6/(n-1)):0;const lp=clamp((p-ln.li*sp)/(1-(n-1)*sp));const pad=ln.px*.1;return{x:ln.x0-pad+(ln.width+2*pad)*E.inOutCubic(lp),lp,pad}}
function dragM(p){return E.inOutCubic(clamp((p-.12)/.62))}

/* ---------- overlays (UI-gesture animations) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function cursorArrow(c,x,y,s,a){if(a<=0)return;const P=[[0,0],[0,1],[.27,.76],[.45,1.12],[.6,1.05],[.42,.7],[.75,.7]];c.save();c.globalAlpha*=a;c.translate(x,y);c.beginPath();P.forEach(([px,py],i)=>i?c.lineTo(px*s,py*s):c.moveTo(px*s,py*s));c.closePath();c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=s*.06;c.lineJoin='round';c.fill();c.stroke();c.restore()}
function hand(c,x,y,s,grab,a){if(a<=0)return;c.save();c.globalAlpha*=a;c.translate(x,y);c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=s*.05;c.lineJoin='round';
  const fh=grab?.22:.42;for(let k=0;k<4;k++){const fx=-.27*s+k*.17*s,len=(k===0?fh:fh+.06-(k===3?.1:0))*s;rr(c,fx,-len,.15*s,len+.25*s,.075*s);c.fill();c.stroke()}
  c.save();c.translate(-.3*s,.12*s);c.rotate(-.7);rr(c,-.07*s,-.24*s,.15*s,.32*s,.075*s);c.fill();c.stroke();c.restore();
  rr(c,-.32*s,0,.7*s,.55*s,.2*s);c.fill();c.stroke();c.restore()}
function drawOverlay(c,layer,id,p,G){
  const b=G.block,em=G.em,fx=G.S.fx||'#ff3b3b';
  if(id==='select'&&layer==='over'){
    const r=selRect(p,G);
    if(r.mq>0){c.save();c.lineWidth=Math.max(1.5,em*.022);c.setLineDash([em*.07,em*.05]);c.lineDashOffset=-G.t*em*.4;c.strokeStyle=fx;c.fillStyle=rgba(fx,.08);c.fillRect(r.x,r.y,r.w,r.h);c.strokeRect(r.x,r.y,r.w,r.h);c.setLineDash([]);
      if(r.mq>=1){const hs=em*.06;c.fillStyle='#fff';[[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]].forEach(([x,y])=>{c.fillRect(x-hs/2,y-hs/2,hs,hs);c.strokeRect(x-hs/2,y-hs/2,hs,hs)})}c.restore()}
    const W2=b.x1-b.x0+2*r.pad,H2=b.bottom-b.top+2*r.pad;let cx,cy,ca=1;
    if(p<.14){const e=E.inOutCubic(p/.14);cx=lerp(r.x+W2*.7,r.x,e);cy=lerp(r.y+H2*1.6,r.y,e);ca=clamp(p*12)}
    else if(p<.8){cx=r.x+r.w;cy=r.y+r.h}
    else{const e=E.inCubic(clamp((p-.8)/.2));cx=r.x+r.w+e*em*.8;cy=r.y+r.h+e*em*.6;ca=1-e}
    if(p<1)cursorArrow(c,cx,cy,em*.34,ca);
  }
  if(id==='drag'&&layer==='over'&&p<1){
    const m=dragM(p);let hx=b.cx+(1-m)*1.4*em+em*.12,hy=b.cy+(1-m)*.9*em+em*.05,ha=clamp(p*12);
    if(p>.8){const e=E.inCubic((p-.8)/.2);hx+=e*em*1.2;hy+=e*em*.8;ha*=1-e}
    hand(c,hx,hy,em*.42,p>.1&&p<.8,ha);
  }
  if(id==='swipe'&&layer==='over'&&p>0&&p<1){
    const a=clamp(p*8)*clamp((1-p)*6),x=G.swipeX,y=b.cy,r=em*.26;c.save();c.globalAlpha*=a;
    const g=c.createLinearGradient(x-em*1.4,0,x,0);g.addColorStop(0,rgba(fx,0));g.addColorStop(1,rgba(fx,.35));c.fillStyle=g;rr(c,x-em*1.4,y-r,em*1.4,r*2,r);c.fill();
    c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=rgba(fx,.28);c.fill();c.lineWidth=em*.045;c.strokeStyle=fx;c.stroke();
    c.beginPath();c.arc(x,y,r*.28,0,7);c.fillStyle='#fff';c.fill();c.restore();
  }
  if(id==='highlight'){
    G.lines.forEach((ln,i)=>{const h=hlEdge(p,ln,G);if(h.lp<=0)return;const y=ln.top-h.pad*.4,hh=ln.bottom-ln.top+h.pad*.8;
      if(layer==='under'){c.fillStyle=fx;c.fillRect(ln.x0-h.pad,y,h.x-(ln.x0-h.pad),hh)}
      else{const last=i===G.nL-1;if(h.lp<1||(last&&p>=1)){const blink=h.lp<1?1:(Math.floor(G.t*2.2)%2?1:.15);c.save();c.globalAlpha*=blink;c.fillStyle=mix(fx,'#ffffff',.35);c.fillRect(h.x-em*.02,y-h.pad*.3,em*.04,hh+h.pad*.6);c.beginPath();c.arc(h.x,y+hh+h.pad*.3,em*.065,0,7);c.fill();c.restore()}}});
  }
  if(id==='redact'&&layer==='over'&&p<1){
    G.lines.forEach(ln=>{const pad=ln.px*.1,x=Math.max(G.redX,ln.x0-pad),x1=ln.x1+pad;if(x>=x1)return;const y=ln.top-pad*.5,hh=ln.bottom-ln.top+pad;
      c.fillStyle=fx;c.fillRect(x,y,x1-x,hh);c.fillStyle='rgba(255,255,255,.9)';c.fillRect(x,y,Math.max(1,ln.px*.02),hh);
      c.fillStyle='rgba(255,255,255,.07)';for(let k=0;k<4;k++)c.fillRect(x,y+hh*(.2+k*.2),x1-x,Math.max(1,ln.px*.01))});
  }
}

const M4={

 mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o},

 S(s){const m=M4.id();m[0]=m[5]=m[10]=s;return m},
 RX(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m},
 RY(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m},
 RZ(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m},
 P(f,asp,n,fa){const t=1/Math.tan(f/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(fa+n)/(n-fa);m[11]=-1;m[14]=2*fa*n/(n-fa);return m},
 xf(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]]}

  loads.push(document.fonts.load('800 40px "Akira Expanded"','AKIRA').catch(()=>{}));
  loads.push(document.fonts.load('italic 400 40px "Instrument Serif"').catch(()=>{}),document.fonts.load('italic 800 40px "EB Garamond"').catch(()=>{}));
  const timeout=new Promise(r=>setTimeout(r,4000));await Promise.race([Promise.all(loads),timeout]);
  $('#loading').hidden=true;Engine.bumpFonts();dirty=true;['looks','style','shine','fx','video'].forEach(k=>{if(panelEls[k]){if(k==='looks'){panelEls.looks.replaceChildren(buildLooks())}else rebuild(k,true)}});
  document.fonts.ready.then(()=>{Engine.bumpFonts();dirty=true})})();
</script>
